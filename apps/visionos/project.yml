name: Superset
options:
  bundleIdPrefix: sh.superset.visionos
  createIntermediateGroups: true
  deploymentTarget:
    visionOS: "2.0"
attributes:
  LastUpgradeCheck: "2640"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Superset:
    type: application
    platform: visionOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.superset.visionos
        GENERATE_INFOPLIST_FILE: "YES"
        # Partial plist merged into the generated Info.plist — registers the
        # superset:// URL scheme for cold-start deep links (the in-session OAuth
        # callback is captured by ASWebAuthenticationSession via its scheme arg).
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "7"
        # Device builds use automatic signing: set DEVELOPMENT_TEAM in Xcode (or via
        # an untracked xcconfig / xcodebuild override) and a device build signs.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        # Simulator builds (the M0 CI gate) run unsigned with no team. Scoped to the
        # simulator SDK so device builds keep signing enabled.
        "CODE_SIGNING_ALLOWED[sdk=xrsimulator*]": "NO"
        "CODE_SIGNING_REQUIRED[sdk=xrsimulator*]": "NO"
        INFOPLIST_KEY_CFBundleDisplayName: Superset
    scheme:
      gatherCoverageData: false
      # The XCUITest smoke gate runs as the scheme's test action, so `xcodebuild test`
      # exercises real flows (research/ui-test-automation.md).
      testTargets:
        - SupersetUITests

  SupersetUITests:
    type: bundle.ui-testing
    platform: visionOS
    sources:
      - path: UITests
      # The app↔test accessibility-id / launch-arg contract, compiled into both targets so
      # they can't drift on a string literal.
      - path: Sources/Support/UITestContract.swift
    dependencies:
      - target: Superset
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.superset.visionos.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Superset
        # The UI runner is unsigned on the simulator gate, mirroring the app target.
        "CODE_SIGNING_ALLOWED[sdk=xrsimulator*]": "NO"
        "CODE_SIGNING_REQUIRED[sdk=xrsimulator*]": "NO"
