name: visionOS agent dispatch

# Free git-event token gate (Superset Feedback Loop field notes): label an issue
# `agent-ready` → dispatch the paused Superset worker automation by id. Zero idle
# tokens (only fires on a real label event). The macOS build runs inside the
# Mac-pinned Superset workspace, so this dispatch-only job runs on a hosted runner.
# Requires repo secret SUPERSET_API_KEY (a Superset sk_live_… key).

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: read

jobs:
  dispatch:
    if: github.event.label.name == 'agent-ready'
    runs-on: ubuntu-latest
    concurrency:
      group: visionos-agent-dispatch
      cancel-in-progress: false
    env:
      SUPERSET_API_KEY: ${{ secrets.SUPERSET_API_KEY }}
      SUPERSET_ORG: 05edb58f-bb09-4f1b-932e-b8d7fc1115d9
      SUPERSET_WORKER: 5b6b8a61-1f19-41b9-a334-5e022ac3d8eb
    steps:
      - name: Install Superset CLI
        run: |
          curl -fsSL https://superset.sh/cli/install.sh | sh
          # installer extracts to $HOME/superset and adds $HOME/superset/bin to PATH
          for d in "$HOME/superset/bin" "$HOME/.local/bin" "$HOME/.superset/bin" "/usr/local/bin"; do
            [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"
          done
      - name: Dispatch worker
        run: |
          superset organization switch "$SUPERSET_ORG"
          superset automations run "$SUPERSET_WORKER"
