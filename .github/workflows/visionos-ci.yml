name: visionOS CI

# The M0 build gate (apps/visionos/README.md) wired into GitHub Actions so an agent
# PR carries a green build signal the API-only reviewer can read. Compiles against the
# visionOS simulator SDK with `-sdk xrsimulator`, which builds without requiring a
# matching simulator *runtime* on the runner (the runtime is only needed to launch the
# app; a Simulator/device launch is the batched human-QA step, not a CI gate).

on:
  push:
    branches: [vision-pro-app]
    paths:
      - "apps/visionos/**"
      - ".github/workflows/visionos-ci.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/visionos/**"
      - ".github/workflows/visionos-ci.yml"

permissions:
  contents: read

concurrency:
  group: visionos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (visionOS simulator SDK)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Authenticate private SwiftPM package (ghostty-visionos)
        # The app depends on the private `heidihowilson/ghostty-visionos` SwiftPM package,
        # whose Libghostty.xcframework ships in-repo via Git LFS. The runner's built-in
        # GITHUB_TOKEN is scoped to this repo only, so SwiftPM can't clone it. Rewrite the
        # package URL to carry a read-scoped PAT (secret GHOSTTY_VISIONOS_TOKEN); the same
        # credential authenticates the LFS smudge during resolution. git-lfs is preinstalled
        # on macos-latest runners.
        env:
          GHOSTTY_VISIONOS_TOKEN: ${{ secrets.GHOSTTY_VISIONOS_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${GHOSTTY_VISIONOS_TOKEN}@github.com/heidihowilson/ghostty-visionos".insteadOf \
            "https://github.com/heidihowilson/ghostty-visionos"
          git lfs install

      - name: Select newest installed Xcode
        # The local gate builds with the latest Xcode/visionOS SDK; the runner's
        # default Xcode lags (e.g. 16.4 / visionOS 2.5 SDK), which enforces UIKit
        # main-actor isolation the newer SDK relaxes and fails the build. Pick the
        # newest installed Xcode so CI matches the documented local toolchain.
        run: |
          ls -d /Applications/Xcode_*.app
          newest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Selecting $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/visionos
        run: xcodegen generate

      - name: Build
        working-directory: apps/visionos
        run: |
          # Use -scheme (not -target): under Xcode 26.4's explicit-module build, -target
          # fails the dependency scan on the TerminalSurface SwiftPM product ("unable to
          # resolve module dependency"). -scheme builds the package product correctly.
          xcodebuild -project Superset.xcodeproj -scheme Superset \
            -sdk xrsimulator -configuration Debug -arch arm64 build
