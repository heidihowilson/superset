name: visionOS CI

# The visionOS gate (apps/visionos/README.md) wired into GitHub Actions so an agent PR
# carries a green signal the API-only reviewer can read. It runs the XCUITest smoke gate
# (apps/visionos/docs/research/ui-test-automation.md): launch → open a workspace window →
# exercise the dictation path. That requires `xcodebuild test`, which boots a visionOS
# Simulator runtime (the runner installs it if missing) — slower than the old build-only
# gate, but it upgrades the signal from "builds + launches" to "builds + navigates + opens
# a window + survives the dictation path", closing the gap that let the dictation-auth
# crash reach hardware. Optic ID, eye-gaze, and live mic/speech stay hardware/manual-QA-only
# (the test runs under `-uiTestMode`, which stubs the signed-in session and pre-grants
# dictation since the Simulator can't automate the permission dialog).

on:
  push:
    branches: [vision-pro-app]
    paths:
      - "apps/visionos/**"
      - ".github/workflows/visionos-ci.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/visionos/**"
      - ".github/workflows/visionos-ci.yml"

permissions:
  contents: read

concurrency:
  group: visionos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: UI smoke test (visionOS simulator)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Select newest installed Xcode
        # The local gate builds with the latest Xcode/visionOS SDK; the runner's default
        # Xcode lags, which enforces UIKit main-actor isolation the newer SDK relaxes and
        # fails the build. Pick the newest installed Xcode so CI matches the local toolchain.
        run: |
          ls -d /Applications/Xcode_*.app
          newest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Selecting $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/visionos
        run: xcodegen generate

      - name: Ensure visionOS Simulator runtime
        # `xcodebuild test` needs a booted runtime (unlike the old `-sdk xrsimulator` build).
        # Download it only if the runner doesn't already ship one.
        run: |
          if ! xcrun simctl list runtimes | grep -qi visionOS; then
            echo "No visionOS runtime — downloading"
            xcodebuild -downloadPlatform visionOS
          fi
          xcrun simctl list runtimes | grep -i visionOS

      - name: Create & boot Apple Vision Pro simulator
        # The runner ships several "Apple Vision Pro" devices across runtimes, so
        # `name=Apple Vision Pro,OS=latest` matches more than one device and xcodebuild
        # bails with exit 70 before running the test. Create a fresh, dedicated device
        # pinned to the newest installed visionOS runtime and target it by UDID so the
        # destination resolves to exactly one device. Pre-grant microphone too
        # (belt-and-suspenders; `-uiTestMode` already stubs dictation, and `simctl privacy`
        # can't grant speech-recognition anyway).
        run: |
          runtime=$(xcrun simctl list runtimes --json \
            | jq -r '[.runtimes[] | select(.name | test("visionOS")) | select(.isAvailable == true)]
                     | sort_by(.version | split(".") | map(tonumber)) | last | .identifier')
          devtype=$(xcrun simctl list devicetypes --json \
            | jq -r '.devicetypes[] | select(.name == "Apple Vision Pro") | .identifier')
          echo "Using runtime=$runtime devtype=$devtype"
          if [ -z "$runtime" ] || [ "$runtime" = "null" ] || [ -z "$devtype" ]; then
            echo "Could not resolve a visionOS runtime / device type" >&2
            xcrun simctl list runtimes
            exit 1
          fi
          udid=$(xcrun simctl create "AVP-CI" "$devtype" "$runtime")
          echo "Created Apple Vision Pro $udid"
          xcrun simctl boot "$udid" || true
          # Wait for the device to finish booting before running the test. A test runner
          # launched against a not-yet-ready device fails with "Failed to background test
          # runner within 30.0s" (Code 10300) — the device, not the app, is the problem.
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl privacy "$udid" grant microphone sh.superset.visionos || true
          echo "AVP_UDID=$udid" >> "$GITHUB_ENV"

      - name: Build & UI test
        working-directory: apps/visionos
        run: |
          xcodebuild test -project Superset.xcodeproj -scheme Superset \
            -destination "id=$AVP_UDID" \
            -resultBundlePath TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: visionos-test-results
          path: apps/visionos/TestResults.xcresult
          if-no-files-found: ignore
